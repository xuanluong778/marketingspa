# Hạ tầng dev local (PostgreSQL + Redis) khi Laragon chưa có Redis/Postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: marketingspa-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketingspa
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_DB: marketingspa
    ports:
      # Chỉ bind loopback — không publish 0.0.0.0/IPv6
      - '127.0.0.1:5434:5432'
    volumes:
      - marketingspa_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketingspa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketingspa-redis-dev
    restart: unless-stopped
    # Ưu tiên 6379; nếu cổng bị chiếm (app khác), map sang 6380 và set REDIS_URL=redis://localhost:6380
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      # Chỉ bind loopback — không publish 0.0.0.0/IPv6
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      # Preserve the running anonymous volume so compose recreate does not wipe BullMQ.
      - redis_data:/data

volumes:
  marketingspa_postgres_dev:
  redis_data:
    external: true
    name: 1f840f4d8aab254d8b603c92f1eb9ce588ae175a0e50e8023b8ec452e7cb08ee
