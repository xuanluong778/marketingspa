<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2918"/>
      <stop offset="100%" stop-color="#1f140c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffcf70" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect x="0" y="0" width="60" height="720" fill="#5a3d24" opacity="0.5"/>
  <rect x="1220" y="0" width="60" height="720" fill="#5a3d24" opacity="0.5"/>
  <!-- wood panels -->
  <g opacity="0.35" stroke="#8b6340" stroke-width="2">
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>
  <circle cx="640" cy="0" r="380" fill="url(#lamp)"/>
  <rect x="560" y="520" width="160" height="40" rx="8" fill="#2a1c12"/>
  <circle cx="500" cy="400" r="28" fill="#222" opacity="0.6"/>
  <circle cx="780" cy="400" r="28" fill="#222" opacity="0.6"/>
  <rect x="0" y="600" width="1280" height="120" fill="#120c08" opacity="0.6"/>
</svg>
